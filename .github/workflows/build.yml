name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build-base:
    name: Build base Images - ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe-base.yml
          - recipe-lite.yml
    steps:
      - name: Build base Images
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          maximize_build_space: true
          build_chunked_oci: true

  build-custom:
    name: Build custom Images - ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe.yml
          - recipe-nvidia.yml
          - recipe-nvidia-generic.yml
          - recipe-prerelease.yml
    steps:
      - name: Build Custom Images
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          maximize_build_space: true
          build_chunked_oci: false
