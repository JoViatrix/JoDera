modules:
  - type: dnf
    repos:
      files:
        - https://repo.librewolf.net/librewolf.repo
      nonfree: negativo17
    install:
      allow-erasing: true
      packages:
        - atuin-all-users
        - chezmoi
        - fuse-libs
        - gamescope
        - innoextract
        - input-remapper
        - librewolf
        - libxcrypt-compat
        - linuxconsoletools
        - make
        - mangohud
        - ncurses-compat-libs
        - nextcloud-client-dolphin
        - obs-studio
        - obs-studio-plugin-vkcapture
        - pipewire-alsa.i686
        - power-profiles-daemon
        - ripgrep
        - steam
        - tailscale
        - vkBasalt
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - toolbox

  - from-file: media-common.yml

  - from-file: wine-staging.yml

  - from-file: cdemu.yml

  - from-file: bitwarden.yml

  - type: script
    scripts:
      - heroic.sh
      - quarto.sh
      - xpadneo.sh

  - from-file: omnissa-horizon.yml

  - from-file: flatpak-defaults.yml

  - type: systemd
    system:
      enabled:
      - tailscaled.service

  - type: chezmoi
    repository: https://github.com/JoViatrix/JoDera-dotfiles
    all-users: true
    file-conflict-policy: skip

  - type: justfiles
    validate: true
    install: true
