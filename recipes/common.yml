modules:
  - type: dnf
    repos:
      files:
        - https://repo.librewolf.net/librewolf.repo
      copr:
        - joviatrix/Dvdisaster
      nonfree: negativo17
    install:
      allow-erasing: true
      packages:
        - atuin-all-users
        - bcache-tools
        - chezmoi
        - clamav
        - clamd
        - corectrl
        - dvdisaster-gtk3
        - flatpak-builder
        - fuse-libs
        - gamescope
        - innoextract
        - input-remapper
        - kaddressbook
        - korganizer
        - librewolf
        - libxcrypt-compat
        - linuxconsoletools
        - make
        - mangohud
        - ncurses-compat-libs
        - nextcloud-client-dolphin
        - ngspice
        - nodejs-npm
        - obs-studio
        - obs-studio-plugin-vkcapture
        - plasma-discover
        - plasma-discover-flatpak
        - plasma-discover-notifier
        - power-profiles-daemon
        - ripgrep
        - screen
        - steam
        - tailscale
        - vkBasalt
        - waydroid
    remove:
      packages:
        - kate
        - firefox
        - firefox-langpacks
        - ptyxis
        - toolbox

  - from-file: media-common.yml

  - from-file: wine-staging.yml

  - from-file: k3b.yml

  - from-file: cdemu.yml

  - type: script
    scripts:
      - aaru.sh
      - heroic.sh
      - xone.sh
      - xpadneo.sh
      # - winboat.sh

  - from-file: winboat.yml

  - from-file: omnissa-horizon.yml

  - from-file: sunshine.yml

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.blitterstudio.amiberry
          - com.borgbase.Vorta
          - com.transmissionbt.Transmission
          - com.vscodium.codium
          - im.riot.Riot
          - info.cemu.Cemu
          - io.github.aandrew_me.ytdn
          - io.github.DenysMb.Kontainer
          - io.github.denysmb.unify
          - io.github.pwr_solaar.solaar
          - io.github.wartybix.Constrict
          - io.github.wivrn.wivrn
          - it.mijorus.gearlever
          - org.filezillaproject.Filezilla
          - org.fkoehler.KTailctl
          - org.freecad.FreeCAD
          - org.gimp.GIMP
          - org.kde.digikam
          - org.kde.gwenview
          - org.kde.haruna
          - org.kde.kclock
          - org.kde.okular
          - org.kde.skanpage
          - org.libreoffice.LibreOffice
          - org.mozilla.thunderbird
          - org.speedcrunch.SpeedCrunch

      - notify: true
        scope: system
        repo:
          url: https://flatpak.dolphin-emu.org/dev.flatpakrepo
          name: dolphin-emu
          title: Dolphin Emu
        install:
          - org.DolphinEmu.dolphin-emu

  - type: chezmoi
    repository: https://github.com/JoViatrix/JoDera-dotfiles
    all-users: true
    file-conflict-policy: skip
