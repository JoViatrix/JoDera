modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - lionheartp/Hyprland
        - runesign/iio-hyprland
    install:
      packages:
        - hyprland
        - iio-hyprland
        - iio-sensor-proxy
        - greetd
        - tuigreet

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: files
    files:
      - source: greetd
        destination: /