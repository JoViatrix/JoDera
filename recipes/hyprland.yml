modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - lionheartp/Hyprland
        - runesign/iio-hyprland
    install:
      packages:
        - cascadia-mono-nf-fonts
        - greetd
        - hypridle
        - hyprland
        - hyprlauncher
        - hyprlock
        - hyprpicker
        - iio-hyprland
        - iio-sensor-proxy
        - NetworkManager-tui
        - tuigreet
        - waybar

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: files
    files:
      - source: hyprland
        destination: /